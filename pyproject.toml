[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pytsv"
version = "0.1.75"
requires-python = ">=3.14"
authors = [
	{ name = "Mark Veltzer", email = "mark.veltzer@gmail.com" }
]
maintainers = [
	{ name = "Mark Veltzer", email = "mark.veltzer@gmail.com" }
]
description = "Pytsv is a the Swiss army knife for TSV files"
readme = "README.md"
license = "MIT"
keywords=[
    "python",
    "tsv",
    "format",
    "csv",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.14",
    "Topic :: Utilities",
    "License :: OSI Approved :: MIT License",
]
dependencies = [
    "pytconf",
    "tqdm",
    "pyanyzip",
    "numpy",
    "pandas",
    "pylogconf",
    "attrs",
]

[project.urls]
"Homepage" = "https://github.com/veltzer/pytsv"
"Bug Tracker" = "https://github.com/veltzer/pytsv/issues"
"Documentation" = "https://veltzer.github.io/pytsv"
"Download" = "https://pypi.org/project/pytsv/"
"Repository" = "https://github.com/veltzer/pytsv"

[project.scripts]
pytsv = "pytsv.main:main"

[tool.ruff]
line-length = 130

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.hatch.build.targets.wheel]
packages = ["src/pytsv"]

[tool.hatch.build.targets.sdist]
include = [
    "src/pytsv/",
    "README.md",
    "LICENSE",
    "pyproject.toml"
]
exclude = [
    ".gitignore",
    ".github/",
    "tests/",
    "docs/",
    "config/",
    "*.md",
]

[tool.pyrefly]
# Type checking (rsconstruct's pyrefly processor). preset = "legacy" is
# pyrefly's mypy-compatible behavior; "." on the search path is mypy's
# implicit current directory.
preset = "legacy"
python-version = "3.14"
search-path = [
    "src",
    ".",
]
# Third-party libraries without type information.
ignore-missing-imports = [
    "pandas.*",
    "pyanyzip.*",
    "pylogconf.*",
    "pytconf.*",
    "tqdm.*",
]

[tool.pyrefly.errors]
no-any-return = "error"

[tool.hatch.envs.default]
installer = "uv"

[tool.uv.pip]
prerelease = "disallow"

[dependency-groups]
dev = [
    "pyrefly",
    "pytest",
    "ruff",
    "sphinx",
    "types-tqdm",
    "pandas-stubs",
]
